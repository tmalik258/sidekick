[package]
name = "sidekick-desktop"
description = "Sidekick desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sidekick_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3", default-features = false }
async-trait = "0.1"
chrono.workspace = true
dirs = "7"
sha2 = "0.10"
which = "8"
getrandom = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sidekick-actions.workspace = true
sidekick-ai.workspace = true
sidekick-core.workspace = true
sidekick-sensors.workspace = true
sidekick-layout.workspace = true
sidekick-skills.workspace = true
sidekick-voice.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
trash = "5"
tokio.workspace = true
ulid.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
xcap = "0.9"
