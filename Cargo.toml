[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tmalik258/sidekick"

[workspace.dependencies]
sidekick-core = { path = "crates/core" }
sidekick-sensors = { path = "crates/sensors" }
sidekick-skills = { path = "crates/skills" }
sidekick-actions = { path = "crates/actions" }
sidekick-ai = { path = "crates/ai" }
sidekick-voice = { path = "crates/voice" }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ulid = { version = "1", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
