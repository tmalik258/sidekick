[package]
name = "sidekick-ntfs"
description = "Live drive index for Sidekick: reads the NTFS file table and change journal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sidekick-indexer"
path = "src/bin/indexer.rs"

[dependencies]
sidekick-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Services",
] }
