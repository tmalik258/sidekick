[package]
name = "sidekick-voice"
description = "Voice for Sidekick: the Hey Sidekick wake word, live speech to text and Supertonic speech, all on this PC (sherpa-onnx)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bzip2 = "0.4"
cpal = "0.16"
log.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
thiserror.workspace = true

# The official bindings, linked statically: no DLLs to ship. On Windows the
# libraries use the static C runtime, so the workspace does too
# (.cargo/config.toml).
sherpa-onnx = "1.13.8"
