id: clipboard.secret-guard
name: Secret guard
description: When you copy a password or API key, clear the clipboard after 30 seconds.
priority: 100
trust: auto
trigger:
  event: clipboard.changed
  where:
    kind: { equals: secret }
suggestion:
  title: "Secret copied"
  detail: "The clipboard clears in 30 seconds."
  options:
    - label: Clear in 30 s
      action: clear_clipboard_later
      args: { seconds: "30" }
    - label: Clear now
      action: clear_clipboard_later
      args: { seconds: "0" }
