id: files.duplicate
name: Duplicate downloads
description: When a download is identical to a file already in the folder, offer to remove the new copy. It goes to the Recycle Bin.
priority: 80
trigger:
  event: file.download_completed
  where:
    duplicate_of: { exists: true }
suggestion:
  title: "Already downloaded"
  detail: "{{name}} is the same as {{duplicate_name}}"
  options:
    - { label: Remove new copy, action: trash_download, args: { path: "{{path}}" } }
    - { label: Show the original, action: reveal_path, args: { path: "{{duplicate_of}}" } }
