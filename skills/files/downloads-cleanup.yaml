id: files.downloads-cleanup
name: Downloads cleanup
description: When Downloads piles up, offer to sort loose files into folders, clear installers you most likely ran already, and move files older than 30 days to the Recycle Bin (FR-FILE-07). About once a week at most.
priority: 20
cooldown_secs: 518400
trigger:
  event: files.downloads_old
suggestion:
  title: "Downloads is piling up"
  detail: "{{summary}}"
  options:
    - { label: Sort into folders, action: sort_downloads, when: { loose: { range: [1, 1000000] } } }
    - { label: Remove old installers, action: clean_installers, when: { installers: { range: [1, 1000000] } } }
    - { label: Move old files to Recycle Bin, action: clean_downloads, when: { count: { range: [1, 1000000] } } }
    - { label: Look first, action: open_folder, args: { path: "{{dir}}" } }
