id: files.screenshot
name: Screenshots
description: When you take a screenshot (Win+PrtScn or the Snipping Tool), offer to pull the text out of it, show it, or copy it again (FR-SCR-01). It never becomes automatic, since the screenshot is already on the clipboard.
priority: 65
cooldown_secs: 5
dedupe: "{{path}}"
trigger:
  event: file.screenshot
  where:
    kind: { equals: image }
suggestion:
  title: "Screenshot taken"
  detail: "{{name}}"
  options:
    - { label: Copy text, action: extract_text, args: { path: "{{path}}" }, requires: ["tool:tesseract"] }
    - { label: Show in folder, action: reveal_path, args: { path: "{{path}}" } }
    - { label: Open, action: open_path, args: { path: "{{path}}" } }
    - { label: Copy, action: copy_file, args: { path: "{{path}}" } }
