id: browser.login
name: Fill logins from your password manager
description: On a sign-in page, offer to fill the login from 1Password or Bitwarden, matched by site (FR-BRW-01). Needs the Sidekick browser extension.
priority: 70
cooldown_secs: 60
dedupe: "{{domain}}"
trigger:
  event: browser.login_form
suggestion:
  title: "Sign in to {{domain}}"
  detail: "Fill from your password manager."
  options:
    - label: Fill from 1Password
      action: browser_fill
      args: { domain: "{{domain}}", tab: "{{tab}}", manager: op }
      requires: ["tool:op"]
    - label: Fill from Bitwarden
      action: browser_fill
      args: { domain: "{{domain}}", tab: "{{tab}}", manager: bw }
      requires: ["tool:bw"]
