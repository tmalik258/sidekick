id: browser.login
name: Fill logins from your browsers
description: On a sign-in page, offer to fill the login from passwords saved in your browsers on this PC (FR-BRW-01). Needs the Sidekick browser extension.
priority: 70
cooldown_secs: 60
dedupe: "{{domain}}"
trigger:
  event: browser.login_form
suggestion:
  title: "Sign in to {{domain}}"
  detail: "Fill from your browser passwords."
  options:
    - label: Fill
      action: browser_fill
      args: { domain: "{{domain}}", tab: "{{tab}}", browser: "{{browser}}" }
      requires: ["tool:browser_passwords"]
