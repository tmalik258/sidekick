id: browser.upwork-job
name: Draft Upwork proposals
description: On an Upwork job page, offer a quick summary of the job and a proposal draft with AI. Needs the Sidekick browser extension.
priority: 60
cooldown_secs: 300
dedupe: "{{url}}"
trigger:
  event: browser.upwork_job
suggestion:
  title: "Upwork job"
  detail: "{{title}}"
  options:
    - label: Summarize the job
      action: ask_ai
      args:
        prompt: "Summarize this Upwork job in four short bullets: what they need, budget and timeline, required skills, and any red flags. Then say if it is a good fit for a full stack Python and Next.js developer."
        page: "{{text}}"
        clipboard: "false"
      requires: ["ai"]
    - label: Draft a proposal
      action: ask_ai
      args:
        prompt: "Draft a short, specific Upwork proposal for this job. Open with how I would solve their problem, mention relevant experience, ask one smart question, and keep it under 150 words."
        page: "{{text}}"
        clipboard: "false"
      requires: ["ai"]
