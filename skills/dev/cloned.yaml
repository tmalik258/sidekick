id: dev.cloned
name: After a clone
description: After Sidekick clones a repo, offer to open it, start an agent in it, and install its dependencies when it has a lockfile.
priority: 60
cooldown_secs: 5
dedupe: "{{path}}"
trigger:
  event: dev.cloned
suggestion:
  title: "{{name}} is cloned"
  detail: "{{path}}"
  options:
    - { label: "Open in {{editor}}", action: open_in_editor, args: { path: "{{path}}" }, requires: ["tool:code"] }
    - { label: Install dependencies, action: install_deps, args: { path: "{{path}}" }, when: { deps_needed: { equals: true } } }
    - { label: Start an agent here, action: agent_here, args: { path: "{{path}}" } }
    - { label: "Always put {{owner}} here", action: clone_rule, args: { owner: "{{owner}}", dir: "{{dir}}" }, when: { ask_rule: { equals: true } } }
