id: dev.repo-status
name: Project status
description: When a repo comes to the front in your editor and it is behind its remote, offer to pull, and to install dependencies only when the new commits change a lockfile or they were never installed (FR-DEV-04).
priority: 55
cooldown_secs: 3600
dedupe: "{{path}}"
trigger:
  event: dev.repo_opened
  where:
    behind: { range: [1, 100000] }
suggestion:
  title: "{{name}} has new commits"
  detail: "{{behind}} behind on {{branch}}"
  options:
    - { label: Pull, action: git_pull, args: { path: "{{path}}" } }
    - { label: Install dependencies, action: install_deps, args: { path: "{{path}}" }, when: { deps_needed: { equals: true } } }
