id: dev.claude-finished
name: Claude Code finished
description: Tell you when a Claude Code session finishes its turn. Needs the Claude Code hook from Settings.
priority: 70
cooldown_secs: 20
dedupe: "{{session}}"
trigger:
  event: claude.stop
suggestion:
  title: "Claude finished in {{project}}"
  detail: "Ready for your review."
  options:
    - { label: "Open in {{editor}}", action: open_in_editor, args: { path: "{{cwd}}" }, requires: ["tool:code"] }
    - { label: Open folder, action: open_folder, args: { path: "{{cwd}}" } }
