id: dev.claude-permission
name: Claude Code permissions
description: Allow or deny Claude Code's permission requests from the island. Unanswered for 25 seconds, Claude Code asks in the terminal as usual. Never automatic.
priority: 95
trigger:
  event: claude.permission
suggestion:
  title: "Claude Code wants to use {{tool}}"
  detail: "{{project}}: {{summary}}"
  options:
    - { label: Allow, action: claude_allow, args: { id: "{{id}}" } }
    - label: Always in {{project}}
      action: claude_always
      args: { id: "{{id}}", cwd: "{{cwd}}", rule: "{{rule}}" }
      when: { rule: { not_one_of: [""] } }
    - { label: Deny, action: claude_deny, args: { id: "{{id}}" } }
    - { label: In terminal, action: claude_pass, args: { id: "{{id}}" } }
