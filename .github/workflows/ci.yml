name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter desktop check:contrast
      - run: pnpm --filter desktop build
      - run: pnpm --filter desktop exec playwright install --with-deps chromium
      - run: pnpm --filter desktop speed
      - run: pnpm --filter desktop visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-screenshots
          path: apps/desktop/visual/
          retention-days: 14

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/sherpa-onnx
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds the built UI, so build it first.
      - run: pnpm --filter desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Drives the real app on Windows: Ask, instant results, tabs, every
  # Settings tab, This PC only, and fails if the UI thread froze.
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: ./.github/actions/sherpa-onnx
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked
      - run: cargo install --git https://github.com/chippers/msedgedriver-tool
      # A WebDriver that matches this runner's WebView2.
      - run: msedgedriver-tool
        working-directory: apps/desktop
      # The test build leaves out the window's own WebView2 arguments: they
      # would replace the debugging port msedgedriver attaches through.
      - run: pnpm --filter desktop tauri build --debug --no-bundle --config src-tauri/tauri.e2e.conf.json
      - name: Start tauri-driver
        shell: pwsh
        run: Start-Process tauri-driver -ArgumentList '--native-driver', "$PWD\apps\desktop\msedgedriver.exe" -WindowStyle Hidden
      - run: pnpm --filter desktop e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: apps/desktop/e2e/
          retention-days: 14
