name: Release

# Builds the Windows installers and attaches them to a draft GitHub release.
# Push a tag like v0.2.0 (after bumping the version, see docs/releasing.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the speech DLLs first, then the app with them bundled.
      - run: pnpm build
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - name: Keep the installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
