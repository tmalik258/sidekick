name: Release

# Builds the Windows installers and attaches them to a draft GitHub release.
# Push a tag like v0.2.0 (after bumping the version, see docs/releasing.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $tauriVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tauriVersion -ne $version -or $packageVersion -ne $version -or $cargoVersion -ne $version) {
            throw "Release tag $version does not match app versions: Tauri=$tauriVersion, package=$packageVersion, Cargo=$cargoVersion"
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/sherpa-onnx
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Signs the app and installers with Azure Trusted Signing when its
      # secrets are set (see docs/releasing.md); unsigned builds otherwise.
      - name: Set up signing
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --locked
          $conf = "apps/desktop/src-tauri/tauri.release.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $cmd = "trusted-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d Duskie %1"
          $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue @{ signCommand = $cmd } -Force
          $json | ConvertTo-Json -Depth 10 | Set-Content $conf
      - run: pnpm build
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - name: Check signatures
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/duskie*.exe, target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            Write-Output "$($f.Name): $($sig.Status)"
            if ($sig.Status -ne "Valid") { throw "$($f.Name) is not signed" }
          }
      # Duskie checks an update against these before running it.
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $version = '${{ github.ref_name }}' -replace '^v', ''
            foreach ($f in $files) {
              if (-not $f.Name.StartsWith("Duskie_${version}_")) {
                throw "Installer $($f.Name) does not match release $version"
              }
            }
          }
          # Builds from before the rename look for Sidekick_ installers; give them one too.
          foreach ($f in @($files | Where-Object Name -like 'Duskie_*_x64-setup.exe')) {
            Copy-Item $f.FullName (Join-Path $f.DirectoryName ($f.Name -replace '^Duskie_', 'Sidekick_'))
          }
          $files = Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi
          if (-not ($files | Where-Object Name -like '*_x64-setup.exe')) { throw 'No x64 NSIS installer was built' }
          $lines = foreach ($f in $files) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $($f.Name)" }
          $lines | Set-Content -Encoding ascii target/release/bundle/SHA256SUMS.txt
          Get-Content target/release/bundle/SHA256SUMS.txt
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.txt
      - name: Keep the installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: duskie-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.txt
