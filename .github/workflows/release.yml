name: Release

# Builds the Windows installers and attaches them to a draft GitHub release.
# Push a tag like v0.2.0 (after bumping the version, see docs/releasing.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-rs-sys downloads the speech libraries here, outside target/.
          cache-directories: ~/AppData/Local/sherpa-rs
      # If target/ came back from the cache without those libraries, make
      # sherpa-rs-sys's build script run again so it downloads them;
      # otherwise linking fails with "cannot open input file 'cargs.lib'".
      - name: Make sure the speech libraries are present
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:LOCALAPPDATA\sherpa-rs")) {
            Get-ChildItem target -Recurse -Directory -Filter "sherpa-rs-sys-*" -ErrorAction SilentlyContinue |
              Where-Object { $_.Parent.Name -in @("build", ".fingerprint") } |
              Remove-Item -Recurse -Force
          }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the speech DLLs first, then the app with them bundled.
      - run: pnpm build
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - name: Keep the installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
